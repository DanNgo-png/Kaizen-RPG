<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company Management - Kaizen RPG</title>
</head>
<body>
    <div class="management-container">
        
        <!-- TOP: Toolbar / Header -->
        <header class="mgmt-header">
            <div class="header-left">
                <button id="btn-back-map" class="btn-icon-circle"><i class="fa-solid fa-arrow-left"></i></button>
                <h2>Company Management</h2>
            </div>
            <div class="header-stats">
                <div class="stat-pill">
                    <i class="fa-solid fa-coins text-gold"></i> <span id="mgmt-gold">0</span>
                </div>
                <div class="stat-pill">
                    <i class="fa-solid fa-users text-blue"></i> <span id="mgmt-roster-count">0/12</span>
                </div>
                <div class="stat-pill stat-pill-strength" title="Group Strength">
                    <i class="fa-solid fa-ranking-star"></i>
                    <span id="mgmt-strength-score">0</span>
                    <span id="mgmt-strength-rating">Unmanned</span>
                    <div class="mgmt-strength-track">
                        <div id="mgmt-strength-fill" class="mgmt-strength-fill"></div>
                    </div>
                </div>
            </div>
        </header>

        <!-- MAIN GRID -->
        <div class="mgmt-layout">
            
            <!-- LEFT: Character Sheet -->
            <section class="char-panel">
                <!-- 1. Header (Name/Level) -->
                <div class="char-header-info">
                    <div class="char-portrait">
                        <i class="fa-solid fa-user-knight"></i>
                    </div>
                    <div class="char-details">
                        <h3 id="char-name">Select a Mercenary</h3>
                        <div class="char-sub">
                            <span id="char-role">Role</span> • Lvl <span id="char-level">1</span>
                        </div>
                        <div class="xp-bar-container">
                            <div class="xp-bar-fill" style="width: 45%"></div>
                            <span class="xp-text">450 / 1000 XP</span>
                        </div>
                    </div>
                </div>

                <!-- 2. Paper Doll (Equipment Slots) -->
                <div class="paper-doll-grid">
                    <div class="doll-slot slot-acc" data-slot="accessory"><i class="fa-solid fa-ring"></i></div>
                    <div class="doll-slot slot-helm" data-slot="head"><i class="fa-solid fa-helmet-safety"></i></div>
                    <div class="doll-slot slot-ammo" data-slot="ammo"><i class="fa-solid fa-crosshairs"></i></div>
                    <div class="doll-slot slot-main" data-slot="main_hand"><i class="fa-solid fa-khanda"></i></div>
                    <div class="doll-slot slot-armor" data-slot="body"><i class="fa-solid fa-shirt"></i></div>
                    <div class="doll-slot slot-off" data-slot="off_hand"><i class="fa-solid fa-shield-halved"></i></div>
                </div>

                <!-- 3. Stats Block (14 Balanced Attributes Alternated Left/Right) -->
                <div class="char-stats-grid">
                    <!-- Row 1 -->
                    <div class="stat-row" title="Head Armor"><i class="fa-solid fa-helmet-safety" style="color: #3b82f6;"></i> <span id="stat-head-armor">0</span></div>
                    <div class="stat-row" title="Melee Skill"><i class="fa-solid fa-khanda" style="color: #e2e8f0;"></i> <span id="stat-melee-skill">0</span></div>
                    <!-- Row 2 -->
                    <div class="stat-row" title="Body Armor"><i class="fa-solid fa-shirt" style="color: #60a5fa;"></i> <span id="stat-body-armor">0</span></div>
                    <div class="stat-row" title="Range Skill"><i class="fa-solid fa-crosshairs" style="color: #94a3b8;"></i> <span id="stat-range-skill">0</span></div>
                    <!-- Row 3 -->
                    <div class="stat-row" title="Health"><i class="fa-solid fa-heart" style="color: #ef4444;"></i> <span id="stat-health">0</span></div>
                    <div class="stat-row" title="Melee Defense"><i class="fa-solid fa-shield" style="color: #3b82f6;"></i> <span id="stat-melee-defense">0</span></div>
                    <!-- Row 4 -->
                    <div class="stat-row" title="Action Points"><i class="fa-solid fa-bolt" style="color: #fbbf24;"></i> <span id="stat-ap">0</span></div>
                    <div class="stat-row" title="Range Defense"><i class="fa-solid fa-shield-halved" style="color: #60a5fa;"></i> <span id="stat-range-defense">0</span></div>
                    <!-- Row 5 -->
                    <div class="stat-row" title="Fatigue"><i class="fa-solid fa-weight-hanging" style="color: #f59e0b;"></i> <span id="stat-fatigue">0</span></div>
                    <div class="stat-row" title="Damage"><i class="fa-solid fa-burst" style="color: #ef4444;"></i> <span id="stat-damage">0</span></div>
                    <!-- Row 6 -->
                    <div class="stat-row" title="Morale"><i class="fa-solid fa-face-smile" style="color: #ec4899;"></i> <span id="stat-morale">Steady (50)</span></div>
                    <div class="stat-row" title="Effectiveness Against Armor"><i class="fa-solid fa-gavel" style="color: #fbbf24;"></i> <span id="stat-armor-effectiveness">100%</span></div>
                    <!-- Row 7 -->
                    <div class="stat-row" title="Resolve"><i class="fa-solid fa-flag" style="color: #a78bfa;"></i> <span id="stat-resolve">0</span></div>
                    <div class="stat-row" title="Chance to Hit Head"><i class="fa-solid fa-bullseye" style="color: #f59e0b;"></i> <span id="stat-head-hit-chance">25%</span></div>
                </div>

                <!-- 4. Perks / Traits -->
                <div class="char-traits-area" id="char-traits-list">
                    <!-- Injected via JS -->
                </div>
            </section>

            <!-- RIGHT: Inventory Stash -->
            <section class="stash-panel">
                <div class="stash-tabs">
                    <button class="stash-tab active" data-filter="all">Stash</button>
                    <button class="stash-tab" data-filter="weapons">Weapons</button>
                    <button class="stash-tab" data-filter="armor">Armor</button>
                    <button class="stash-tab" data-filter="consumables">Supplies</button>
                </div>

                <div class="stash-grid-container" id="stash-grid">
                    <!-- Grid of Items generated by JS -->
                </div>

                <div class="stash-footer">
                    <div class="capacity-bar">
                        <i class="fa-solid fa-weight-hanging"></i>
                        <div class="cap-track"><div class="cap-fill" style="width: 30%"></div></div>
                        <span>30 / 100</span>
                    </div>
                    <button class="management-sort-btn"><i class="fa-solid fa-filter"></i> Sort</button>
                </div>
            </section>

            <!-- BOTTOM: Roster Strip -->
            <section class="roster-strip-container">
                <button class="roster-nav-btn left"><i class="fa-solid fa-chevron-left"></i></button>
                <div class="roster-scroll-area" id="roster-list">
                    <!-- Mercenary Avatars injected here -->
                </div>
                <button class="roster-nav-btn right"><i class="fa-solid fa-chevron-right"></i></button>
            </section>

        </div>
    </div>
</body>
</html>
